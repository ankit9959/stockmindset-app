name: Build StockMindset Pro APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create & Assemble Flutter Project
        run: |
          flutter create --org com.stockmindset --project-name stockmindset app
          cd app
          flutter pub add fl_chart flutter_tts shared_preferences http intl
          cp ../lib/main.dart lib/main.dart
          flutter build apk --release --no-tree-shake-icons

      - name: Upload StockMindset APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockMindset-Pro-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
